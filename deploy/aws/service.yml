AWSTemplateFormatVersion: "2010-09-09"
Description: >
  api-node · Servicio ECS Fargate (Node.js + Express). Publicado en el ALB compartido en el puerto 3000.
  Requiere la pila de plataforma (infra/aws/platform.yml) con el mismo ProjectName.

Metadata:
  cfn-lint:
    config:
      # Las salidas muestran la URL del servicio a partir del DNS del ALB importado (intencional).
      ignore_checks: [W6001]

Parameters:
  ProjectName:
    Type: String
    Default: retotecnico
    Description: Prefijo usado por la pila de plataforma (sus exportaciones se importan con este nombre).
  ImageUri:
    Type: String
    Description: Imagen en ECR (la define deploy.sh), p. ej. 123456789012.dkr.ecr.us-east-1.amazonaws.com/retotecnico/api-node:abc123
  Cpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024"]
  Memory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048"]
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 4
  ListenerPort:
    Type: Number
    Default: 3000
    Description: Puerto del ALB en el que se publica api-node.
  LogLevel:
    Type: String
    Default: info
    AllowedValues: [fatal, error, warn, info, debug]

  CapacityProvider:
    Type: String
    Default: FARGATE_SPOT
    AllowedValues: [FARGATE_SPOT, FARGATE]
    Description: FARGATE_SPOT es ~70 % más barato (puede interrumpirse; ECS reemplaza la tarea). FARGATE para mayor estabilidad.

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}/api-node"
      RetentionInDays: 7

  # Rol que usa ECS para descargar la imagen, escribir logs y leer el secreto JWT.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-jwt-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: { "Fn::ImportValue": !Sub "${ProjectName}-JwtSecretArn" }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-api-node"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: api-node
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 3000, Protocol: tcp }]
          Environment:
            - { Name: PORT, Value: "3000" }
            - { Name: JWT_ISSUER, Value: api-go }
            - { Name: JWT_AUDIENCE, Value: matrix-services }
            - { Name: LOG_LEVEL, Value: !Ref LogLevel }
            - Name: CORS_ALLOWED_ORIGINS
              Value: !Sub
                - "http://${AlbDns}"
                - AlbDns: { "Fn::ImportValue": !Sub "${ProjectName}-AlbDns" }
          Secrets:
            - Name: JWT_SECRET
              ValueFrom: { "Fn::ImportValue": !Sub "${ProjectName}-JwtSecretArn" }
          HealthCheck:
            Command: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api-node

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-api-node"
      VpcId: { "Fn::ImportValue": !Sub "${ProjectName}-VpcId" }
      Protocol: HTTP
      Port: 3000
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "15" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: { "Fn::ImportValue": !Sub "${ProjectName}-AlbArn" }
      Port: !Ref ListenerPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: api-node
      Cluster: { "Fn::ImportValue": !Sub "${ProjectName}-ClusterName" }
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      CapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED # subredes públicas sin NAT: la IP pública permite descargar la imagen de ECR
          Subnets: !Split [",", { "Fn::ImportValue": !Sub "${ProjectName}-PublicSubnets" }]
          SecurityGroups: [{ "Fn::ImportValue": !Sub "${ProjectName}-TasksSecurityGroup" }]
      LoadBalancers:
        - ContainerName: api-node
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ServiceUrl:
    Value: !Sub
      - "http://${AlbDns}:${ListenerPort}"
      - AlbDns: { "Fn::ImportValue": !Sub "${ProjectName}-AlbDns" }
  DocsUrl:
    Value: !Sub
      - "http://${AlbDns}:${ListenerPort}/docs"
      - AlbDns: { "Fn::ImportValue": !Sub "${ProjectName}-AlbDns" }
  LogGroup:
    Value: !Ref LogGroup
